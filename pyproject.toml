[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modmenuext"
version = "1.0.2"
description = "External Delta-V mod manager with Steam autodiscovery and ModMenu2 config editing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "certifi>=1.14.1",
]

[project.scripts]
modmenuext = "modmenuext.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
